# Publish the static site to GitHub Pages through a custom Actions workflow.
# Only the allowlisted website files are staged; reports, tests, docs and _temp
# are never uploaded. No pull_request trigger and no third-party secrets.
name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run site tests
        run: npm test

  build:
    name: Stage website files
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stage only publishable website files
        run: |
          set -euo pipefail
          site="_site"
          mkdir -p "$site/data" "$site/assets"
          cp index.html styles.css app.js "$site/"
          cp data/housing.json "$site/data/"
          cp assets/aclaria-map.jpg "$site/assets/"
          test -f "$site/index.html"
          test -f "$site/styles.css"
          test -f "$site/app.js"
          test -f "$site/data/housing.json"
          test -f "$site/assets/aclaria-map.jpg"
          echo "Staged files:"
          find "$site" -type f -print | sort
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
